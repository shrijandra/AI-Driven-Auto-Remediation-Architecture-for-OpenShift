---
- name: Create Network Policy
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if network policy is needed
      meta: end_play
      when: needs_network_policy is not defined or not needs_network_policy | bool
      
    - name: Show parameters
      debug:
        msg:
          - "Target namespace : {{ target_namespace }}"
          - "Target app       : {{ target_app }}"
          - "Source namespace : {{ source_namespace }}"
          - "Source app       : {{ source_app }}"
          - "Port             : {{ target_port }}"
          - "Protocol         : {{ protocol | default('TCP') }}"
          
    - name: Create NetworkPolicy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: "allow-{{ source_app }}-to-{{ target_app }}"
            namespace: "{{ target_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: "{{ target_app }}"
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: "{{ source_namespace }}"
                  - podSelector:
                      matchLabels:
                        app: "{{ source_app }}"
                ports:
                  - protocol: "{{ protocol | default('TCP') }}"
                    port: "{{ target_port | default(3306) | int }}"

    - name: Verify NetworkPolicy created
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        name: "allow-{{ source_app }}-to-{{ target_app }}"
        namespace: "{{ target_namespace }}"
      register: policy_result

    - name: Show result
      debug:
        msg: "NetworkPolicy {{ policy_result.resources[0].metadata.name }} created successfully"

---
- name: Fix OpenShift SCC Permission Issue
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check if SCC fix is needed
      meta: end_play
      when: needs_scc_fix is not defined or not needs_scc_fix | bool
    
    - name: Show parameters
      debug:
        msg:
          - "Namespace       : {{ namespace }}"
          - "Service Account : {{ service_account }}"
          - "SCC             : {{ scc | default('anyuid') }}"
          - "Deployment      : {{ deployment_name }}"

    - name: Add SCC to service account
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ service_account }}-{{ scc | default('anyuid') }}-scc"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "system:openshift:scc:{{ scc | default('anyuid') }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ service_account }}"
              namespace: "{{ namespace }}"

    - name: Verify ClusterRoleBinding created
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{ service_account }}-{{ scc | default('anyuid') }}-scc"
      register: crb_result

    - name: Show result
      debug:
        msg: "ClusterRoleBinding {{ crb_result.resources[0].metadata.name }} created"

    - name: Restart deployment to apply new SCC
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: "{{ deployment_name }}"
        namespace: "{{ namespace }}"
        replicas: 0

    - name: Scale back up
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: "{{ deployment_name }}"
        namespace: "{{ namespace }}"
        replicas: 1

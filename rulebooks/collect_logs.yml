---
- name: Collect OpenShift Pod Logs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Show variables
      debug:
        msg:
          - "Namespace: {{ namespace }}"
          - "Pod: {{ pod_name }}"

    - name: Get pod info
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ namespace }}"
      register: pod_info
      failed_when: false

    - name: Get pod logs
      kubernetes.core.k8s_log:
        name: "{{ pod_name }}"
        namespace: "{{ namespace }}"
        tail_lines: 200
      register: pod_logs
      failed_when: false

    - name: Get previous container logs
      kubernetes.core.k8s_log:
        name: "{{ pod_name }}"
        namespace: "{{ namespace }}"
        tail_lines: 200
        previous: true
      register: pod_logs_previous
      failed_when: false

    - name: Get namespace events
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Event
        namespace: "{{ namespace }}"
      register: events_raw
      failed_when: false

    - name: Format events
      set_fact:
        pod_events: >-
          {{ events_raw.resources | default([])
            | sort(attribute='metadata.creationTimestamp')
            | map(attribute='message') | list | join('\n') }}

    - name: Display logs
      debug:
        msg:
          - "--- current logs ---"
          - "{{ pod_logs.log_lines | default([]) }}"
          - "--- previous logs ---"
          - "{{ pod_logs_previous.log_lines | default([]) }}"

    - name: Save data for AI triage
      set_stats:
        data:
          pod_logs: "{{ pod_logs.log_lines | default([]) | join('\n') }}"
          pod_logs_previous: "{{ pod_logs_previous.log_lines | default([]) | join('\n') }}"
          pod_description: "{{ pod_info.resources[0] | default({}) | to_nice_json }}"
          pod_events: "{{ pod_events }}"
          pod_name: "{{ pod_name }}"
          namespace: "{{ namespace }}"

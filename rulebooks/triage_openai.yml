---
- name: AI Triage for OpenShift Alerts
  hosts: localhost
  gather_facts: false
  vars:
    pod_logs: "{{ pod_logs | default('No logs provided') }}"
    pod_logs_previous: "{{ pod_logs_previous | default('No previous logs provided') }}"
    pod_description: "{{ pod_description | default('No description provided') }}"
    pod_events: "{{ pod_events | default('No events provided') }}"
    pod_name: "{{ pod_name | default('unknown') }}"
    namespace: "{{ namespace | default('unknown') }}"

  tasks:
    - name: Verify input variables
      debug:
        msg:
          - "Namespace : {{ namespace }}"
          - "Pod       : {{ pod_name }}"
          - "Logs size : {{ pod_logs | length }} chars"

    - name: Analyze OpenShift logs with OpenAI
      uri:
        url: https://api.openai.com/v1/responses
        method: POST
        headers:
          Authorization: "Bearer {{ openai_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body:
          model: gpt-4o
          input: |
            You are an OpenShift/Kubernetes SRE expert. Analyze the following pod failure data.

            Pod: {{ pod_name }}
            Namespace: {{ namespace }}

            === CURRENT CONTAINER LOGS ===
            {{ pod_logs }}

            === PREVIOUS CONTAINER LOGS (pre-crash) ===
            {{ pod_logs_previous }}

            === POD DESCRIPTION ===
            {{ pod_description }}

            === NAMESPACE EVENTS ===
            {{ pod_events }}

            Return your analysis in this exact format:
            ROOT CAUSE: <concise explanation>
            SEVERITY: <critical|high|medium|low>
            RECOMMENDED ACTION: <specific steps to resolve>
        timeout: 60
        validate_certs: true
      register: ai_analysis

    - name: Extract AI triage result
      set_fact:
        triage_result: "{{ ai_analysis.json.output[0].content[0].text }}"

    - name: Show AI triage result
      debug:
        msg: "{{ triage_result }}"

    - name: Save triage result as artifact
      set_stats:
        data:
          triage_result: "{{ triage_result }}"
          pod_name: "{{ pod_name }}"
          namespace: "{{ namespace }}"

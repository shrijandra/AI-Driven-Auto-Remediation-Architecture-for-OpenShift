---
- name: AI Triage for OpenShift Alerts
  hosts: localhost
  gather_facts: false
  vars:
    pod_logs: "{{ pod_logs | default('No logs provided') }}"
    pod_logs_previous: "{{ pod_logs_previous | default('No previous logs provided') }}"
    pod_description: "{{ pod_description | default('No description provided') }}"
    pod_events: "{{ pod_events | default('No events provided') }}"
    pod_name: "{{ pod_name | default('unknown') }}"
    namespace: "{{ namespace | default('unknown') }}"

  tasks:
    - name: Verify input variables
      debug:
        msg:
          - "Namespace : {{ namespace }}"
          - "Pod       : {{ pod_name }}"
          - "Logs size : {{ pod_logs | default('') | length }} chars"

    - name: Analyze OpenShift logs with OpenAI
      uri:
        url: https://api.openai.com/v1/responses
        method: POST
        headers:
          Authorization: "Bearer {{ openai_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body:
          model: gpt-4o
          input: |
            You are an OpenShift SRE expert. Analyze this pod failure.

            Pod: {{ pod_name }}
            Namespace: {{ namespace }}

            === CURRENT LOGS ===
            {{ pod_logs }}

            === PREVIOUS LOGS ===
            {{ pod_logs_previous | default('none') }}

            === POD DESCRIPTION ===
            {{ pod_description | default('none') }}

            === EVENTS ===
            {{ pod_events | default('none') }}

            Respond ONLY in this exact JSON format, no extra text:
            {
              "root_cause": "<concise explanation>",
              "severity": "<critical|high|medium|low>",
              "recommended_action": "<specific steps>",
              "remediation_type": "<scc_permission|network_policy|restart_pod|scale_deployment|manual>",
              "service_account": "<service account name or null>",
              "scc field MUST always be "anyuid" for nginx permission errors",
              "NEVER return "restricted-v2 or restricted" as scc value",
              "restricted-v2 or restricted are the default SCC and will not fix permission issues",
              "deployment_name": "<deployment name or null>",
              "target_namespace: the namespace being connected TO (backend)",
              "target_app: the app being connected TO (mysql)",
              "source_namespace: the namespace trying to connect (frontend)",
              "source_app: the app trying to connect (frontend-checker)",
              "target_port: integer port number, no quotes (3306)"
            }
            PRIORITY ORDER for analysis:
            1. Pod logs are the PRIMARY source of truth
            2. Events are SECONDARY context only
            3. Node-level issues (disk pressure, memory) are BACKGROUND noise
               - Never choose "manual" just because of node pressure
               - Focus on what the APPLICATION log shows

            The log shows:
            "Unable to connect to mysql-service.backend.svc.cluster.local:3306"
            "Error: timed out"

            This is a NETWORK CONNECTIVITY issue between namespaces.
            Node disk pressure does NOT cause inter-namespace connection timeouts.

            STRICT RULES:
            - Connection timeout to *.svc.cluster.local → ALWAYS network_policy
            - Permission denied on filesystem → ALWAYS scc_permission  
            - Node disk pressure alone → NOT a reason for manual
            - NEVER choose manual if logs show a clear connection error
        timeout: 60
      register: ai_analysis
      
    - name: Extract raw AI response
      set_fact:
        raw_response: "{{ ai_analysis.json.output[0].content[0].text }}"

    - name: Show raw response for debugging
      debug:
        msg: "{{ raw_response }}"

    - name: Parse AI JSON response
      set_fact:
        triage_json: "{{ raw_response | regex_replace('```json', '') | regex_replace('```', '') | trim | from_json }}"
      no_log: false
      vars:
        ansible_jinja2_native: true

    - name: Show AI triage result
      debug:
        msg:
          - "ROOT CAUSE         : {{ triage_json.root_cause }}"
          - "SEVERITY           : {{ triage_json.severity }}"
          - "RECOMMENDED ACTION : {{ triage_json.recommended_action }}"
          - "REMEDIATION TYPE   : {{ triage_json.remediation_type }}"

    - name: Set remediation flags
      set_fact:
        needs_network_policy: "{{ triage_json.remediation_type == 'network_policy' }}"
        needs_scc_fix: "{{ triage_json.remediation_type == 'scc_permission' }}"
        needs_restart: "{{ triage_json.remediation_type == 'restart_pod' }}"
        needs_scale: "{{ triage_json.remediation_type == 'scale_deployment' }}"

    - name: Save all artifacts for next workflow node
      set_stats:
        data:
          # Triage results
          triage_result: "{{ triage_json.root_cause }}"
          severity: "{{ triage_json.severity }}"
          recommended_action: "{{ triage_json.recommended_action }}"
          remediation_type: "{{ triage_json.remediation_type }}"

          # Remediation flags
          needs_network_policy: "{{ triage_json.remediation_type == 'network_policy' }}"
          needs_scc_fix: "{{ triage_json.remediation_type == 'scc_permission' }}"   
          needs_restart: "{{ triage_json.remediation_type == 'restart_pod' }}"
          needs_scale: "{{ triage_json.remediation_type == 'scale_deployment' }}"

          # SCC parameters
          service_account: "{{ triage_json.service_account | default('nginx-sa') }}"
          scc: "{{ triage_json.scc | default('anyuid') }}"
          deployment_name: "{{ triage_json.deployment_name | default('nginx') }}"
          restart_deployment: true

          # Network policy parameters (populated by AI)
          target_namespace: "{{ triage_json.target_namespace | default(backend) }}"
          target_app: "{{ triage_json.target_app | default('mysql') }}"
          source_namespace: "{{ triage_json.source_namespace | default('frontend') }}"
          source_app: "{{ triage_json.source_app | default('frontend-checker') }}"
          target_port: "{{ triage_json.target_port | default(3306) }}"

          # Pass through for reference
          pod_name: "{{ pod_name }}"
          namespace: "{{ namespace }}"

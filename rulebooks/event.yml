- name: OpenShift Auto Recovery
  hosts: all
  match_multiple_rules: true
  sources:
    - ansible.eda.pg_listener:
        pg_port: 5432
  rules:
    - name: Debug incoming event
      condition: event.payload is defined
      action:
        debug:
          msg: "{{ event }}"

    - name: CrashLoopBackOff Recovery
      condition: event.payload.alerts[0].labels.alertname == "PodCrashLooping"
      action:
        run_workflow_template:
          name: gather_logs
          organization: Default
          job_args:
            extra_vars:
              namespace: "{{ event.payload.alerts[0].labels.namespace }}"
              pod_name: "{{ event.payload.alerts[0].labels.pod }}"
